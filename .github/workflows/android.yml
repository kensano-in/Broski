name: Build Verlyn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Restore packed Kotlin sources (first migration only)
        run: |
          if compgen -G "tools/verlyn-source/part*.xz.b64" > /dev/null; then
            cat tools/verlyn-source/part*.xz.b64 | base64 --decode | tar -xJf - -C .
          fi
          test -s app/src/main/java/com/verlyn/audio/MainActivity.kt
          test -s app/src/main/java/com/verlyn/audio/VerlynAudioEngine.kt

      - name: Correct Android SDK API symbols and Kotlin setters
        run: |
          sed -i 's/import android.media.AudioEffect/import android.media.audiofx.AudioEffect/' \
            app/src/main/java/com/verlyn/audio/MainActivity.kt
          sed -i 's/VARIANT_FAVOR_FREQUENCY,/VARIANT_FAVOR_FREQUENCY_RESOLUTION,/' \
            app/src/main/java/com/verlyn/audio/VerlynAudioEngine.kt
          sed -i 's/setSessionCompatibility(/updateSessionCompatibility(/g' \
            app/src/main/java/com/verlyn/audio/MainActivity.kt
          sed -i 's/setMusicVolume(/updateMusicVolume(/g' \
            app/src/main/java/com/verlyn/audio/MainActivity.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Materialize Kotlin source files in repository
        run: |
          if compgen -G "tools/verlyn-source/part*.xz.b64" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/verlyn/audio/MainActivity.kt
            git add app/src/main/java/com/verlyn/audio/VerlynAudioEngine.kt
            git rm tools/verlyn-source/part*.xz.b64
            git commit -m "Materialize Verlyn 0.1.2 Kotlin sources [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verlyn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
