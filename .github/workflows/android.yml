name: Build Verlyn APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon --warning-mode=all clean :app:compileDebugKotlin :app:assembleDebug
      - name: Verify VERLYN APK metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.4.1'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='13'"
      - name: Upload VERLYN 0.4.1 APK
        uses: actions/upload-artifact@v7
        with:
          name: verlyn-0.4.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
